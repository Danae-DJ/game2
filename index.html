<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-board">
            <canvas id="canvas"></canvas>
            <span class="score">0</span>

            <div id="pause-message">PAUSED</div>

            <div class="menu">
                <h2>SNAKE</h2>

                <!-- Game mode selection -->
                <div class="mode-selection">
                    <button id="one-player">1 PLAYER</button>
                    <button id="two-players">2 PLAYERS</button>
                </div>

                <!-- Character selection -->
                <div class="character-selection">
                    <div class="characters">
                        <canvas id="snake-1"></canvas>
                        <canvas id="snake-2"></canvas>
                    </div>

                    <p>Select a character</p>
                    <span>Use "A" and "D" to move the Snake</span>
                    <span>Use "Space" → Pause and "Enter" → Restart or buttons</span>
                </div>

                <!-- Two-player character selection -->
                <div class="multiplayer-selection">
                    <h3 id="player-turn">PLAYER 1 - SELECT YOUR SNAKE</h3>

                    <div class="multiplayer-characters">
                        <canvas id="snake-3"></canvas>
                        <canvas id="snake-4"></canvas>
                        <canvas id="snake-5"></canvas>
                        <canvas id="snake-6"></canvas>
                    </div>

                    <span>PLAYER 1: A / D</span>
                    <span>PLAYER 2: LEFT / RIGHT</span>
                </div>
            </div>
        </div>
                <!-- Multiplayer game boards -->
        <div class="multiplayer-boards">

            <!-- Player 1 board -->
            <div class="player-board">
                <h3>PLAYER 1</h3>
                <div class="board-area">
                    <canvas id="canvas-player1"></canvas>
                    <span class="player-score" id="score-player1">0</span>
                </div>
            </div>

            <!-- Player 2 board -->
            <div class="player-board">
                <h3>PLAYER 2</h3>
                <div class="board-area">
                    <canvas id="canvas-player2"></canvas>
                    <span class="player-score" id="score-player2">0</span>
                </div>
            </div>
            
        </div>
        <div class="game-controls">
            <button id="pause-button">PAUSE</button>
            <button id="restart-button">RESTART</button>
        </div>

    </div>
    <script src="js/classes.js"></script>
    <script src="script.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/multiplayer.js"></script>
</body>
</html>
